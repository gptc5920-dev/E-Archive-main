name: e_archive
description: E-Archive desktop login app using clean architecture.
publish_to: "none"
version: 1.0.1+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  cross_file: ^0.3.4+2
  crypto: ^3.0.6
  desktop_drop: ^0.6.0
  file_picker: ^8.1.7
  path: ^1.9.1
  pdf: ^3.11.3
  fl_chart: ^1.2.0
  e_archive_server:
    path: server
  window_manager: ^0.5.1
  pdfrx: ^2.2.24
  hugeicons: ^0.0.7
  image: ^4.8.0
  data_table_2: ^2.7.2
  printing: ^5.14.3
  windows_printer: ^0.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  inno_bundle: ^0.11.2
  shelf: ^1.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

inno_bundle:
  id: fe266b30-7b8a-11f1-953e-9f17ebff28d3 # <-- Put your app id here
  publisher: registrar # Optional, but recommended.
  name: e-archive # Also optional, but recommended.
  admin: false
  languages:
    - english
